<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BraveBot — Interactive Part Explorer</title>
<style>
  :root{ --bg0:#0b0e14; --bg1:#11161f; --panel:rgba(18,23,32,.82); --line:#222b39;
         --txt:#e7ecf3; --dim:#8b97a8; --accent:#4ea3ff; --accent2:#7ee0c0; }
  *{ box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--bg0);
    color:var(--txt); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; }
  #app{ position:fixed; inset:0; }
  canvas{ display:block; }
  .panel{ position:absolute; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; backdrop-filter:blur(14px); box-shadow:0 12px 40px rgba(0,0,0,.45); }
  /* header */
  #title{ top:18px; left:18px; padding:14px 18px; max-width:340px; }
  #title h1{ margin:0; font-size:18px; letter-spacing:.2px; }
  #title h1 b{ color:var(--accent); }
  #title p{ margin:4px 0 0; color:var(--dim); font-size:12.5px; }
  /* parts list */
  #parts{ top:18px; right:18px; bottom:104px; width:286px; display:flex; flex-direction:column; }
  #parts .hd{ padding:13px 16px 9px; border-bottom:1px solid var(--line); }
  #parts .hd b{ font-size:13px; } #parts .hd span{ color:var(--dim); font-size:11.5px; }
  #list{ overflow:auto; padding:6px; flex:1; }
  .grp{ color:var(--dim); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    padding:11px 10px 5px; display:flex; align-items:center; gap:7px; }
  .dot{ width:9px; height:9px; border-radius:3px; flex:none; }
  .item{ display:flex; align-items:center; gap:9px; padding:7px 10px; border-radius:9px;
    cursor:pointer; color:#cdd6e2; } .item:hover{ background:rgba(78,163,255,.10); }
  .item.sel{ background:rgba(78,163,255,.20); color:#fff; }
  .item .nm{ font-size:12.5px; line-height:1.25; } .item .sub{ color:var(--dim); font-size:11px; }
  /* info card */
  #info{ left:18px; bottom:104px; width:330px; padding:16px 18px; display:none; }
  #info h2{ margin:0 0 2px; font-size:16px; } #info .tag{ display:inline-block; margin:0 0 9px;
    padding:2px 9px; border-radius:99px; font-size:11px; color:#0b0e14; font-weight:600; }
  #info p{ margin:0 0 10px; color:#c4cdd9; font-size:13px; }
  #info .specs{ display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:12px; }
  #info .specs .k{ color:var(--dim); } #info .x{ position:absolute; top:12px; right:14px;
    cursor:pointer; color:var(--dim); font-size:16px; } #info .x:hover{ color:#fff; }
  /* controls */
  #ctrl{ left:50%; transform:translateX(-50%); bottom:18px; padding:12px 16px;
    display:flex; align-items:center; gap:16px; }
  #ctrl .ex{ display:flex; align-items:center; gap:11px; }
  #ctrl label{ color:var(--dim); font-size:11.5px; white-space:nowrap; }
  #slider{ width:240px; accent-color:var(--accent); }
  .btn{ background:#1b2433; border:1px solid var(--line); color:#dbe3ee; padding:7px 13px;
    border-radius:9px; cursor:pointer; font-size:12.5px; } .btn:hover{ border-color:var(--accent); color:#fff; }
  .btn.on{ background:rgba(78,163,255,.22); border-color:var(--accent); color:#fff; }
  #hint{ position:absolute; left:18px; bottom:84px; color:var(--dim); font-size:11.5px; }
  #loading{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; color:var(--dim); background:var(--bg0); z-index:9; }
  .spin{ width:34px; height:34px; border:3px solid #1c2533; border-top-color:var(--accent);
    border-radius:50%; animation:s 1s linear infinite; } @keyframes s{ to{ transform:rotate(360deg);} }
  .sep{ width:1px; height:24px; background:var(--line); }
  .plabel{ background:rgba(13,20,32,.86); border:1px solid var(--line); color:#dbe3ee;
    padding:2px 8px; border-radius:7px; font-size:11px; white-space:nowrap; pointer-events:none;
    transform:translate(8px,-50%); box-shadow:0 3px 10px rgba(0,0,0,.4); }
</style>
</head>
<body>
<div id="app"></div>

<div id="loading"><div class="spin"></div><div id="lmsg">loading robot…</div></div>

<div id="title" class="panel">
  <h1><b>BraveBot</b> · Part Explorer</h1>
  <p id="subtitle">Wheel-legged autonomous inspection robot — drag to orbit, click any part, slide to explode.</p>
</div>

<div id="parts" class="panel">
  <div class="hd"><b>Parts</b> &nbsp;<span id="pcount"></span></div>
  <div id="list"></div>
</div>

<div id="info" class="panel">
  <span class="x" onclick="window.__deselect()">✕</span>
  <h2 id="i_name"></h2>
  <span class="tag" id="i_tag"></span>
  <p id="i_desc"></p>
  <div class="specs" id="i_specs"></div>
</div>

<div id="ctrl" class="panel">
  <div class="ex">
    <label>Assembled</label>
    <input id="slider" type="range" min="0" max="100" value="0">
    <label>Exploded</label>
  </div>
  <div class="sep"></div>
  <button class="btn" id="b_explode">Explode</button>
  <button class="btn" id="b_rotate">Auto-rotate</button>
  <button class="btn" id="b_group">Color by group</button>
  <button class="btn" id="b_labels">Labels</button>
  <button class="btn" id="b_sensors">Highlight sensors</button>
  <button class="btn" id="b_reset">Reset view</button>
</div>
<div id="hint">drag = orbit · scroll = zoom · click a part to inspect</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const GROUP_COLORS = {                       // educational "color by group" palette
  Chassis:'#9aa6b6', Legs:'#f4a14e', Wheels:'#3a3f4b', Structure:'#7e8aa0',
  Compute:'#4ea3ff', Sensors:'#7ee0c0', Power:'#ffd35e', Comms:'#c78bff', Safety:'#ff6b6b'
};

const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0b0e14');
scene.fog = new THREE.Fog('#0b0e14', 6, 16);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.05, 100);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();              // HTML labels overlay (leader-line tips)
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none';
app.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.minDistance = 0.8; controls.maxDistance = 12;

// lighting — soft studio 3-point + rim
scene.add(new THREE.HemisphereLight('#aab9d4', '#10141c', 0.7));
const key = new THREE.DirectionalLight('#ffffff', 2.1);
key.position.set(3,5,4); key.castShadow = true;
key.shadow.mapSize.set(2048,2048); key.shadow.camera.near=0.5; key.shadow.camera.far=20;
key.shadow.camera.left=-3; key.shadow.camera.right=3; key.shadow.camera.top=3; key.shadow.camera.bottom=-3;
key.shadow.bias=-0.0004; scene.add(key);
const fill = new THREE.DirectionalLight('#86b6ff', 0.6); fill.position.set(-4,2,-2); scene.add(fill);
const rim  = new THREE.DirectionalLight('#bfe9ff', 0.8); rim.position.set(-1,3,-5); scene.add(rim);

// ground
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(6, 64),
  new THREE.MeshStandardMaterial({ color:'#0e131c', roughness:1, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(12, 48, '#1c2636', '#141b27');
grid.material.transparent=true; grid.material.opacity=.5; scene.add(grid);

// rotate Z-up (MuJoCo) into Y-up (three) so the robot stands upright
const robot = new THREE.Group(); robot.rotation.x = -Math.PI/2; scene.add(robot);

const raycaster = new THREE.Raycaster(); const pointer = new THREE.Vector2();
const meshes = []; let CENTROID = new THREE.Vector3(); let selected = null;
let colorByGroup = false; let autoRotate = false; let targetExplode = 0, explode = 0;

function matFor(p){
  const c = colorByGroup ? new THREE.Color(GROUP_COLORS[p.group_label]||'#9aa6b6')
                         : new THREE.Color(p.color[0],p.color[1],p.color[2]);
  return new THREE.MeshStandardMaterial({ color:c, metalness:.55, roughness:.42,
    emissive:new THREE.Color('#000'), emissiveIntensity:0 });
}

const loader = new STLLoader();
fetch('parts.json?t='+Date.now()).then(r=>r.json()).then(async data=>{   // bust browser cache
  document.getElementById('subtitle').textContent =
    data.robot + ' — drag to orbit, click any part, slide to explode.';
  document.getElementById('pcount').textContent = data.n_parts + ' parts';
  CENTROID.set(...data.centroid);

  let done=0;
  await Promise.all(data.parts.map(p => new Promise(res=>{
    loader.load(p.file, geo=>{
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, matFor(p));
      mesh.castShadow = mesh.receiveShadow = true;
      mesh.position.set(...p.pos);
      mesh.quaternion.set(p.quat[1],p.quat[2],p.quat[3],p.quat[0]); // [w,x,y,z]->three xyzw
      mesh.userData = p;
      mesh.userData.home = mesh.position.clone();
      const dir = mesh.position.clone().sub(CENTROID);
      mesh.userData.dir = dir.lengthSq()<1e-6 ? new THREE.Vector3(0,0,1) : dir.clone();
      robot.add(mesh); meshes.push(mesh);
      // exploded label + leader line (hidden until the Labels toggle is on)
      const ldiv=document.createElement('div'); ldiv.className='plabel'; ldiv.textContent=p.name;
      const lbl=new CSS2DObject(ldiv); robot.add(lbl);
      const lgeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);
      const line=new THREE.Line(lgeo, new THREE.LineBasicMaterial({color:0x4ea3ff,transparent:true,opacity:.55}));
      robot.add(line); lbl.visible=line.visible=false;
      mesh.userData.lbl=lbl; mesh.userData.line=line;
      document.getElementById('lmsg').textContent = `loading robot… ${++done}/${data.parts.length}`;
      res();
    }, undefined, ()=>{ console.warn('missing', p.file); res(); });
  })));

  buildList(data);
  frameRobot(true);
  document.getElementById('loading').style.display='none';
});

// ---- parts list (grouped) ----
function buildList(data){
  const list = document.getElementById('list');
  let html=''; let cur=null;
  for(const p of data.parts){
    if(p.group_label!==cur){ cur=p.group_label;
      html+=`<div class="grp"><span class="dot" style="background:${GROUP_COLORS[cur]||'#9aa6b6'}"></span>${cur}</div>`; }
    html+=`<div class="item" data-id="${p.id}"><div><div class="nm">${p.name}</div>
      <div class="sub">${p.sensor?('sensor · '+p.sensor.modality):p.id}</div></div></div>`;
  }
  list.innerHTML=html;
  list.querySelectorAll('.item').forEach(el=>{
    el.onclick=()=>{ const m=meshes.find(x=>x.userData.id===el.dataset.id); select(m,true); };
  });
}

// ---- selection / info ----
function select(mesh, focus){
  if(selected) setEmissive(selected,0);
  selected = mesh;
  document.querySelectorAll('.item').forEach(e=>e.classList.toggle('sel', e.dataset.id===mesh.userData.id));
  for(const m of meshes) m.material.opacity = (m===mesh)?1:1, m.material.transparent=false;
  for(const m of meshes){ const dim = (m!==mesh); m.material.opacity = dim?0.18:1; m.material.transparent = dim; }
  setEmissive(mesh, .9);
  const p = mesh.userData;
  document.getElementById('i_name').textContent = p.name;
  const tag = document.getElementById('i_tag');
  tag.textContent = p.group_label; tag.style.background = GROUP_COLORS[p.group_label]||'#9aa6b6';
  document.getElementById('i_desc').textContent = p.desc || '';
  const specs = document.getElementById('i_specs'); specs.innerHTML='';
  const add=(k,v)=>{ specs.innerHTML+=`<div class="k">${k}</div><div>${v}</div>`; };
  add('part id', p.id);
  if(p.mass!=null) add('mass', p.mass.toFixed(2)+' kg');
  if(p.sensor){ add('sensor', p.sensor.modality); add('range', p.sensor.range_m+' m'); add('FOV', p.sensor.fov_deg+'°'); }
  document.getElementById('info').style.display='block';
  if(focus) focusOn(mesh);
}
function setEmissive(mesh,v,col){ mesh.material.emissive.set(v?(col||'#1d4f8c'):'#000'); mesh.material.emissiveIntensity=v; }
window.__deselect = ()=>{ if(selected) setEmissive(selected,0);
  for(const m of meshes){ m.material.opacity=1; m.material.transparent=false; }
  selected=null; document.getElementById('info').style.display='none';
  document.querySelectorAll('.item').forEach(e=>e.classList.remove('sel')); };

// ---- pointer pick ----
renderer.domElement.addEventListener('pointerdown', e=>{ down=[e.clientX,e.clientY]; });
let down=[0,0];
renderer.domElement.addEventListener('pointerup', e=>{
  if(Math.hypot(e.clientX-down[0], e.clientY-down[1])>5) return;       // drag, not click
  pointer.x=(e.clientX/innerWidth)*2-1; pointer.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hit = raycaster.intersectObjects(meshes,false)[0];
  if(hit) select(hit.object,false); else window.__deselect();
});
renderer.domElement.addEventListener('pointermove', e=>{
  pointer.x=(e.clientX/innerWidth)*2-1; pointer.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  renderer.domElement.style.cursor = raycaster.intersectObjects(meshes,false).length?'pointer':'grab';
});

// ---- camera framing / focus tween ----
let tween=null;
function frameRobot(instant){
  const box=new THREE.Box3().setFromObject(robot); const c=box.getCenter(new THREE.Vector3());
  const s=box.getSize(new THREE.Vector3()); const r=Math.max(s.x,s.y,s.z);
  const to=c.clone().add(new THREE.Vector3(r*1.1, r*0.55, r*1.5));
  moveCam(to,c,instant);
}
function focusOn(mesh){
  const box=new THREE.Box3().setFromObject(mesh); const c=box.getCenter(new THREE.Vector3());
  const r=Math.max(...box.getSize(new THREE.Vector3()).toArray(),0.12);
  const dir=camera.position.clone().sub(controls.target).normalize();
  moveCam(c.clone().add(dir.multiplyScalar(r*4.2)), c, false);
}
function moveCam(pos,tgt,instant){
  if(instant){ camera.position.copy(pos); controls.target.copy(tgt); return; }
  tween={p0:camera.position.clone(),p1:pos,t0:controls.target.clone(),t1:tgt,k:0};
}

// ---- controls ----
const slider=document.getElementById('slider');
slider.oninput=()=>{ targetExplode=slider.value/100; setBtn('b_explode', targetExplode>0.01); };
function setExplode(v){ targetExplode=v; slider.value=Math.round(v*100); setBtn('b_explode', v>0.01); }
document.getElementById('b_explode').onclick=()=> setExplode(targetExplode>0.5?0:1);
document.getElementById('b_reset').onclick=()=>{ frameRobot(false); };
document.getElementById('b_rotate').onclick=function(){ autoRotate=!autoRotate; this.classList.toggle('on',autoRotate); };
document.getElementById('b_group').onclick=function(){ colorByGroup=!colorByGroup; this.classList.toggle('on',colorByGroup);
  for(const m of meshes){ const keep=m.material.emissiveIntensity,op=m.material.opacity,tr=m.material.transparent;
    m.material.dispose(); m.material=matFor(m.userData); m.material.opacity=op; m.material.transparent=tr;
    setEmissive(m, m===selected?0.9:0); } };
function setBtn(id,on){ document.getElementById(id).classList.toggle('on',on); }

let labelsOn=false;
document.getElementById('b_labels').onclick=function(){ labelsOn=!labelsOn; this.classList.toggle('on',labelsOn);
  if(labelsOn && targetExplode<0.2) setExplode(1); };          // auto-explode so labels read clearly
let sensorsOn=false;
document.getElementById('b_sensors').onclick=function(){ sensorsOn=!sensorsOn; this.classList.toggle('on',sensorsOn);
  window.__deselect();
  for(const m of meshes){ const isS=!!m.userData.sensor;
    if(sensorsOn){ m.material.opacity=isS?1:0.10; m.material.transparent=!isS; setEmissive(m, isS?1.0:0, '#2fae7e'); }
    else { m.material.opacity=1; m.material.transparent=false; setEmissive(m,0); } } };

addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight); });

// ---- loop ----
const EXP=1.55;
function tick(){
  requestAnimationFrame(tick);
  explode += (targetExplode-explode)*0.12;
  for(const m of meshes){ const off=m.userData.dir.clone().multiplyScalar(explode*EXP);
    off.add(m.userData.dir.clone().normalize().multiplyScalar(explode*0.12));
    m.position.copy(m.userData.home).add(off); }
  // exploded labels + leader lines
  for(const m of meshes){ const lbl=m.userData.lbl, line=m.userData.line; if(!lbl) continue;
    if(labelsOn){ const out=m.userData.dir.clone().normalize().multiplyScalar(0.07+explode*0.05);
      const lp=m.position.clone().add(out); lbl.position.copy(lp);
      line.geometry.setFromPoints([m.position, lp]); lbl.visible=line.visible=true; }
    else if(lbl.visible){ lbl.visible=line.visible=false; } }
  if(autoRotate) robot.rotation.z += 0.0032;
  if(tween){ tween.k=Math.min(1,tween.k+0.06); const e=tween.k<.5?2*tween.k*tween.k:1-Math.pow(-2*tween.k+2,2)/2;
    camera.position.lerpVectors(tween.p0,tween.p1,e); controls.target.lerpVectors(tween.t0,tween.t1,e);
    if(tween.k>=1) tween=null; }
  controls.update(); renderer.render(scene,camera); labelRenderer.render(scene,camera);
}
tick();
</script>
</body>
</html>
