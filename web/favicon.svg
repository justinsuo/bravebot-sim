<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0e131c"/>
  <!-- antennae -->
  <g stroke="#7ee0c0" stroke-width="1.4" stroke-linecap="round">
    <line x1="12" y1="7" x2="12" y2="3.5"/>
    <line x1="20" y1="7" x2="20" y2="3.5"/>
  </g>
  <circle cx="12" cy="3" r="1.3" fill="#7ee0c0"/>
  <circle cx="20" cy="3" r="1.3" fill="#7ee0c0"/>
  <!-- head + sensor eye -->
  <rect x="9" y="7" width="14" height="8" rx="2.2" fill="#4ea3ff"/>
  <circle cx="16" cy="11" r="2" fill="#0b0e14"/>
  <circle cx="16" cy="11" r="0.9" fill="#7ee0c0"/>
  <!-- torso -->
  <rect x="11" y="15.5" width="10" height="6.5" rx="1.8" fill="#9aa6b6"/>
  <!-- legs -->
  <g stroke="#7e8aa0" stroke-width="2" stroke-linecap="round">
    <line x1="13" y1="22" x2="11" y2="25"/>
    <line x1="19" y1="22" x2="21" y2="25"/>
  </g>
  <!-- drive wheels -->
  <circle cx="10.5" cy="26.5" r="3.2" fill="#3a3f4b" stroke="#cfe0f5" stroke-width="1.2"/>
  <circle cx="21.5" cy="26.5" r="3.2" fill="#3a3f4b" stroke="#cfe0f5" stroke-width="1.2"/>
</svg>
